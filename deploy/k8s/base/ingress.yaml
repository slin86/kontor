apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kontor
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
spec:
  ingressClassName: nginx
  tls:
    - hosts: [kontor.example.com]
      secretName: kontor-tls
  rules:
    - host: kontor.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kontor-web
                port:
                  name: http
