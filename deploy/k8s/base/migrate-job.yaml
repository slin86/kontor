# Runs the database migrations before every Argo CD sync, so the API pods can start with a
# fixed command and several of them never migrate at the same time.
apiVersion: batch/v1
kind: Job
metadata:
  name: kontor-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/slin86/kontor-api
          command: ["alembic", "upgrade", "head"]
          env:
            - name: KONTOR_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: kontor-db
                  key: database-url
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 192Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
