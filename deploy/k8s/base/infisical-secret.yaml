# Syncs the secrets from Infisical into the Secret `kontor-secrets` (plain Opaque), which the API
# reads as environment variables. Same setup as the other homelab apps; the secrets themselves are
# entered in Infisical under the path below, never in this repository.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: kontor-secrets
spec:
  hostAPI: http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080/api
  resyncInterval: 60
  authentication:
    universalAuth:
      credentialsRef:
        secretName: infisical-machine-identity
        secretNamespace: infisical-operator
      secretsScope:
        projectSlug: homelab-ei-fj
        envSlug: prod
        secretsPath: /kontor
  managedSecretReference:
    secretName: kontor-secrets
    secretNamespace: kontor
    creationPolicy: Owner
