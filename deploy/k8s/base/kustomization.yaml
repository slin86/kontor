apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kontor
labels:
  - pairs:
      app.kubernetes.io/name: kontor
      app.kubernetes.io/part-of: kontor
resources:
  - namespace.yaml
  - configmap.yaml
  - migrate-job.yaml
  - api.yaml
  - web.yaml
  - ingress.yaml
images:
  - name: ghcr.io/slin86/kontor-api
    newTag: latest
  - name: ghcr.io/slin86/kontor-web
    newTag: latest
