apiVersion: v1
kind: ConfigMap
metadata:
  name: kontor-config
data:
  KONTOR_COOKIE_SECURE: "true"
  KONTOR_TIMEZONE: Europe/Berlin
  # The first household can always be created; further ones only when this is "true".
  KONTOR_ALLOW_NEW_HOUSEHOLDS: "false"
  KONTOR_CORS_ORIGINS: "[]"
  # AI helper, off while empty. A local OpenAI-compatible server (Ollama, LM Studio) reads statements and
  # suggests categories; set the host of the machine that runs it, for example:
  # Ollama: "http://gaming-pc.home.lan:11434", LM Studio: "http://gaming-pc.home.lan:1234"
  # KONTOR_AI_LOCAL_URL: "http://gaming-pc.home.lan:1234"
  # KONTOR_AI_LOCAL_MODEL: "qwen2.5:14b"
