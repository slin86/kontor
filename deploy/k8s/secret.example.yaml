# Not part of the kustomization on purpose: never commit the real secret.
# Create it once (or manage it with Sealed Secrets / External Secrets) before the first sync:
#
#   kubectl create namespace kontor
#   kubectl -n kontor create secret generic kontor-db \
#     --from-literal=database-url='postgresql+psycopg://kontor:<password>@<postgres-host>:5432/kontor'
apiVersion: v1
kind: Secret
metadata:
  name: kontor-db
  namespace: kontor
type: Opaque
stringData:
  database-url: postgresql+psycopg://kontor:CHANGE-ME@postgres.example.svc:5432/kontor
