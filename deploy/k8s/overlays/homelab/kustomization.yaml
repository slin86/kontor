# Your environment. Adjust the host in ingress.yaml, then let Argo CD sync it.
# CI updates the image tags below after each build of `main`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kontor
resources:
- ../../base
- ingress.yaml
  # The home.lan ingress is served over plain HTTP, so the session cookie must not be "Secure".
  # Set this back to "true" once the ingress terminates TLS.
patches:
- patch: |-
    - op: replace
      path: /data/KONTOR_COOKIE_SECURE
      value: "false"
  target:
    kind: ConfigMap
    name: kontor-config
images:
- name: ghcr.io/slin86/kontor-api
  newName: ghcr.io/slin86/kontor-api
  newTag: sha-9ab3a19
- name: ghcr.io/slin86/kontor-web
  newName: ghcr.io/slin86/kontor-web
  newTag: sha-9ab3a19
