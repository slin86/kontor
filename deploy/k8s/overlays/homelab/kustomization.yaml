# Your environment. Adjust the host, the ingress class and the TLS issuer, then let Argo CD sync it.
# CI updates the image tags below after each build of `main`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: ghcr.io/slin86/kontor-api
    newTag: latest
  - name: ghcr.io/slin86/kontor-web
    newTag: latest
patches:
  - target:
      kind: Ingress
      name: kontor
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: kontor.home.example
      - op: replace
        path: /spec/tls/0/hosts/0
        value: kontor.home.example
      - op: add
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
        value: letsencrypt
