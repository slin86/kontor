# Internal-only ingress, same style as the other *.home.lan apps: no entrypoint annotations,
# so Traefik serves it on every entrypoint (plain HTTP on port 80 included).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kontor
spec:
  ingressClassName: traefik
  rules:
    - host: kontor.home.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kontor-web
                port:
                  number: 80
