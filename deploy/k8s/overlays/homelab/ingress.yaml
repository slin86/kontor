# Internal only, like the other homelab apps behind Traefik. A finance tool should not get a public
# IngressRoute; add one next to this file only if you really want that.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kontor
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: kontor.home.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kontor-web
                port:
                  number: 80
