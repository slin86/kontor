# Homelab deployment: API and web UI (nginx, port 8080). The database is an existing Postgres,
# configured through KONTOR_DATABASE_URL in .env. Put your TLS-terminating reverse proxy in front
# of the `web` service.
services:
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      KONTOR_DATABASE_URL: ${KONTOR_DATABASE_URL:?set KONTOR_DATABASE_URL in .env}
      KONTOR_COOKIE_SECURE: ${KONTOR_COOKIE_SECURE:-true}
      KONTOR_TIMEZONE: ${KONTOR_TIMEZONE:-Europe/Berlin}
      KONTOR_ALLOW_NEW_HOUSEHOLDS: ${KONTOR_ALLOW_NEW_HOUSEHOLDS:-false}
      KONTOR_CORS_ORIGINS: '[]'
    # Lets the URL point at a Postgres that runs on the Docker host: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8000"

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${KONTOR_PORT:-8080}:8080"
