name: Images

# Builds and publishes the container images when application code changes on main, then points the
# homelab overlay at the new tag so Argo CD rolls it out. The tag commit only touches deploy/, which
# this workflow does not watch, so it cannot trigger itself.
on:
  push:
    branches: [main]
    paths:
      - backend/**
      - frontend/**
      - .github/workflows/images.yml
  workflow_dispatch:

concurrency:
  group: images
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OWNER: slin86

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/kontor-api:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/kontor-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/kontor-web:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/kontor-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # one tag bump at a time, so concurrent merges do not race on the same file
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Point the homelab overlay at the new images and push
        run: |
          tag='${{ needs.publish.outputs.tag }}'
          kustomize_version=v5.4.3
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${kustomize_version}/kustomize_${kustomize_version}_linux_amd64.tar.gz" | tar -xz -C /tmp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The file only holds generated tags, so on a race we start over from the latest main
          # and redo the edit instead of rebasing (which conflicts on the tag lines).
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            (cd deploy/k8s/overlays/homelab && /tmp/kustomize edit set image \
              ghcr.io/slin86/kontor-api=ghcr.io/slin86/kontor-api:${tag} \
              ghcr.io/slin86/kontor-web=ghcr.io/slin86/kontor-web:${tag})
            git add deploy/k8s/overlays/homelab/kustomization.yaml
            git diff --cached --quiet && exit 0
            git commit -m "Deploy ${tag} [skip ci]"
            git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1
