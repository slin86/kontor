name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  migrations:
    # The tests run on SQLite; this checks the migrations and models against real Postgres.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kontor
          POSTGRES_USER: kontor
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kontor" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      KONTOR_DATABASE_URL: postgresql+psycopg://kontor:ci@localhost:5432/kontor
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run alembic downgrade base
      - run: uv run alembic upgrade head

  docker:
    # Builds both images and runs the whole stack through the web container.
    runs-on: ubuntu-latest
    env:
      KONTOR_DB_PASSWORD: ci-password
      KONTOR_COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait --wait-timeout 180
      - name: Smoke test through nginx
        run: |
          curl -fsS http://localhost:8080/api/health
          curl -fsS http://localhost:8080/ | grep -q '<div id="root"'
          curl -fsS -c jar -X POST http://localhost:8080/api/auth/register \
            -H 'content-type: application/json' \
            -d '{"email":"ci@example.com","password":"correct-horse-battery","display_name":"CI","household_name":"CI"}'
          csrf=$(awk '$6=="kontor_csrf"{print $7}' jar)
          curl -fsS -b jar http://localhost:8080/api/depot
          curl -fsS -b jar -X PUT http://localhost:8080/api/tax/settings \
            -H "X-CSRF-Token: $csrf" -H 'content-type: application/json' \
            -d '{"church_tax_percent":0}'
      - if: failure()
        run: docker compose logs --no-color
